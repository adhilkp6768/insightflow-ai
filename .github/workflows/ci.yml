name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenMP for XGBoost
        run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Install the API
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests
      - name: Test
        run: pytest
        env:
          JWT_SECRET: test-secret-key-with-32-characters-min
          DATABASE_URL: sqlite+pysqlite:///:memory:
          REDIS_URL: ""
          RATE_LIMIT_ENABLED: "false"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install OpenMP for XGBoost
        run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Install the API
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Install the web app and Playwright
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run the signed-in analytics path
        working-directory: frontend
        run: npx playwright test
        env:
          CI: "true"
          JWT_SECRET: test-secret-key-with-32-characters-min
          DATABASE_URL: sqlite+pysqlite:///./e2e.db
          REDIS_URL: ""
          RATE_LIMIT_ENABLED: "false"
