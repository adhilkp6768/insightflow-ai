[project]
name = "insightflow-api"
version = "0.1.0"
description = "InsightFlow AI API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "pyjwt>=2.10",
  "argon2-cffi>=23.1",
  "redis>=5.2",
  "python-multipart>=0.0.20",
  "pandas>=2.2",
  "numpy>=2.0",
  "openpyxl>=3.1",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "statsmodels>=0.14",
  "reportlab>=4.2",
  "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.27",
  "httpx2>=2.16",
  "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 180
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
